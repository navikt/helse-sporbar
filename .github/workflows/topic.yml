name: aiven - Deploy Kafka-topics

on:
  push:
    branches:
      - main
    paths:
      - '.nais/sis.yaml'
      - '.nais/sis.*.yaml'
      - '.nais/utbetaling.yaml'
      - '.nais/utbetaling.*.yaml'
      - '.nais/vedtak.yaml'
      - '.nais/vedtak.*.yaml'
      - '.github/workflows/topic.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write # for nais login

jobs:
  deploy-dev:
    name: Deploy til dev
    uses: navikt/sykepenger-github-workflows/.github/workflows/deploy-v2.yml@fc1bc4b862baacc4b4d8e0519bf3dc9040a2e644 # v1.0.11
    with:
      manifest: .nais/utbetaling.yaml
      environment: dev-gcp
      extra_manifests: .nais/vedtak.yaml,.nais/sis.yaml
    permissions:
      contents: read
      id-token: write # for nais login

  deploy-prod:
    name: Deploy til prod
    uses: navikt/sykepenger-github-workflows/.github/workflows/deploy-v2.yml@fc1bc4b862baacc4b4d8e0519bf3dc9040a2e644 # v1.0.11
    with:
      manifest: .nais/utbetaling.yaml
      environment: prod-gcp
      extra_manifests: .nais/vedtak.yaml,.nais/sis.yaml
    permissions:
      contents: read
      id-token: write # for nais login
